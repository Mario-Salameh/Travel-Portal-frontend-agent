<div class="card border-0 shadow-sm h-100 kpi-card overflow-hidden">
  <div style="height: 4px" [style.background]="color"></div>
  <div class="card-body py-3 px-3">
    <div class="d-flex align-items-center">
      <div
        class="rounded-3 d-flex align-items-center justify-content-center flex-shrink-0 me-3"
        [style.background-color]="bgColor"
        style="width: 44px; height: 44px"
      >
        <i class="bi fs-4" [ngClass]="icon" [style.color]="color"></i>
      </div>
      <div class="overflow-hidden flex-grow-1">
        <p class="text-muted small mb-1 text-truncate fw-semibold">{{ title }}</p>
        <h5 class="fw-bold mb-0" style="color: #3a1a0a">{{ value }}</h5>
      </div>
      <div class="ms-2 text-end flex-shrink-0">
        <span
          class="badge rounded-pill"
          [class]="up ? 'text-bg-success' : 'text-bg-danger'"
          style="font-size: 0.68rem"
        >
          <i class="bi me-1" [ngClass]="up ? 'bi-arrow-up-right' : 'bi-arrow-down-right'"></i
          >{{ change }}
        </span>
      </div>
    </div>
  </div>
</div>
