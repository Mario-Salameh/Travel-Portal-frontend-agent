<div class="responsive-page bg-light" style="min-height: 100vh; overflow-y: auto">
  <div class="container-fluid p-4">
    <!-- Header -->
    <div class="control-panel-header d-flex align-items-start justify-content-between mb-2">
      <div>
        <div class="d-flex align-items-center gap-2 mb-1">
          <img src="trust-logo.png" style="width: 36px" alt="Trust Logo" />
          <h2 class="mb-0">Company Management</h2>
        </div>
        <small class="text-muted ps-1">Manage company settings and fee configurations</small>
      </div>
      <button class="btn btn-danger d-flex align-items-center gap-2" (click)="logout()">
        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>
      </button>
    </div>

    <hr class="mt-2 mb-4" />

    <!-- Companies Grid -->
    <div class="row gy-3">
      @for (company of companies; track company.companyGroupId) {
        <div class="col-lg-6 col-12">
          <div class="card border-1 shadow-sm h-100">
            <!-- Card Header -->
            <div
              class="card-header d-flex align-items-center justify-content-between py-3"
              style="background-color: #f8f9fa; border-bottom: 2px solid #dee2e6"
            >
              <div class="d-flex align-items-center gap-2">
                <div
                  class="rounded-3 p-2 d-flex align-items-center justify-content-center"
                  [style.background-color]="company.isEnabled ? '#24599f' : '#6c757d'"
                >
                  <i class="bi bi-building text-white fs-5"></i>
                </div>
                <div>
                  <h6 class="fw-bold mb-0">{{ company.name }}</h6>
                  <small class="text-muted">Group ID: {{ company.companyGroupId }}</small>
                </div>
              </div>
              <span
                class="badge rounded-pill"
                [class.bg-success]="company.isEnabled"
                [class.bg-secondary]="!company.isEnabled"
              >
                {{ company.isEnabled ? 'Active' : 'Inactive' }}
              </span>
            </div>

            <!-- Card Body -->
            <div class="card-body pt-3">
              <!-- Enable/Disable Toggle -->
              <div
                class="mb-3 d-flex align-items-center justify-content-between p-2 rounded-2"
                style="background-color: #f0f4fa"
              >
                <div>
                  <label class="form-label mb-0 fw-semibold">Customer Portal</label>
                  <div>
                    <small class="text-muted"
                      >Enable or disable the customer portal for this company</small
                    >
                  </div>
                </div>
                <div class="form-check form-switch mb-0 ps-0 ms-3">
                  <input
                    class="form-check-input fs-5"
                    type="checkbox"
                    role="switch"
                    style="cursor: pointer"
                    [id]="'enabled_' + company.companyGroupId"
                    [(ngModel)]="company.isEnabled"
                  />
                </div>
              </div>

              <!-- Existing Customer Fees -->
              <div class="mb-3">
                <label class="form-label mb-1 fw-semibold">
                  <i class="bi bi-person-check-fill me-1 text-primary"></i>
                  Existing Customer Management Fees
                </label>
                <div class="input-group">
                  <input
                    type="number"
                    class="form-control"
                    [(ngModel)]="company.existingCustomerManagementFeesPercent"
                    min="0"
                    max="100"
                    step="0.5"
                    placeholder="0"
                  />
                  <span class="input-group-text">%</span>
                </div>
              </div>

              <!-- New Customer Fees -->
              <div class="mb-1">
                <label class="form-label mb-1 fw-semibold">
                  <i class="bi bi-person-plus-fill me-1 text-primary"></i>
                  New Customer Management Fees
                </label>
                <div class="input-group">
                  <input
                    type="number"
                    class="form-control"
                    [(ngModel)]="company.newCustomerManagementFeesPercent"
                    min="0"
                    max="100"
                    step="0.5"
                    placeholder="0"
                  />
                  <span class="input-group-text">%</span>
                </div>
              </div>
            </div>

            <!-- Card Footer -->
            <div class="card-footer bg-transparent d-flex justify-content-end pb-3 pt-2 border-0">
              <button
                class="btn btn-primary d-flex align-items-center gap-2"
                (click)="
                  updateCompanyInfo(
                    company.companyGroupId!,
                    company.isEnabled!,
                    company.existingCustomerManagementFeesPercent!,
                    company.newCustomerManagementFeesPercent!
                  )
                "
              >
                <i class="bi bi-floppy2-fill"></i>
                Update
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
