<div class="login-page d-flex justify-content-center align-items-center overflow-hidden">
    <form class="login-form d-flex flex-column align-items-center justify-content-center"
        [formGroup]="loginForm" (ngSubmit)="onLogin()">

        <img src="trust-logo.png" class="d-block mx-auto mb-3" style="height: 90px;" alt="Trust logo">
        <h1 class="text-center"> Travel Inurance System</h1>
        <h5 class="mb-5 text-center"> CO - Palestine </h5>

        <div class="login-field mb-2">
            <label for="exampleInputEmail1" class="form-label">Username</label>
            <input type="text" class="form-control" id="exampleInputEmail1"
                aria-describedby="emailHelp" formControlName="username">
        </div>

        <div class="login-field mb-4">
            <label for="exampleInputPassword1" class="form-label">Password</label>
            <input type="password" class="form-control" id="exampleInputPassword1"
                formControlName="password">
        </div>

        <div class="d-flex gap-2 align-items-center">
            <button class="btn btn-info" id="liveToastBtn" type="button" (click)="showInfo()">
                <i class="bi bi-info text-light"></i>
            </button>
            <button type="submit" class="btn btn-primary col-2" style="width: 160px;">Sign
                in</button>
        </div>
    </form>

    <img src="login-screen-background.png" class="login-illustration d-none d-lg-inline" alt="Travel insurance illustration">
</div>
