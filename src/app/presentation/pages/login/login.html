<div class="d-flex justify-content-center align-items-center overflow-hidden"
    style="height: 100vh; background-color: #FEFEFE;">
    <form class="d-flex flex-column align-items-center justify-content-center" style="min-width: 500px; height: 700px;"
        [formGroup]="loginForm" (ngSubmit)="onLogin()">

        <img src="trust-logo.png" class="d-block mx-auto mb-3" style="height: 90px;">
        <h1 class="text-center"> Travel Inurance System</h1>
        <h5 class="mb-5 text-center"> CO - Palestine </h5>

        <div class="mb-2">
            <label for="exampleInputEmail1" class="form-label">Username</label>
            <input type="text" style="width: 300px;" class="form-control" id="exampleInputEmail1"
                aria-describedby="emailHelp" formControlName="username">
        </div>

        <div class="mb-4">
            <label for="exampleInputPassword1" class="form-label">Password</label>
            <input type="password" style="width: 300px;" class="form-control" id="exampleInputPassword1"
                formControlName="password">
        </div>

        <div class="d-flex gap-2 align-items-center">
            <button class="btn btn-info" id="liveToastBtn" type="button" (click)="showInfo()">
                <i class="bi bi-info text-light"></i>
            </button>
            <button type="submit" class="btn btn-primary col-2" style="width: 160px;">Sign
                in</button>
        </div>
    </form>

    <img src="login-screen-background.png" class="d-none d-lg-inline" style="width: 500px;">
</div>
