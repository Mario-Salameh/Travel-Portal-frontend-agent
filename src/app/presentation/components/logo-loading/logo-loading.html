<div class="logo-wrapper">
  <div class="logo-flip">
    <img src="trust-logo.png" alt="Trust Logo" class="trust-logo">
  </div>

  <style>
    .logo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .logo-wrapper::before {
      content: '';
      position: absolute;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: black;
      border-bottom-color: black;
      opacity: 0.5;
      animation: rotate 0.4s linear infinite;
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .logo-flip {
      width: 65px;
      height: 65px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    .trust-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: brightness(65%);
    }
  </style>
</div>
