<div class="blur-overlay">
  <div class="loading-overlay">
    <div class="loading-container">
      <div class="logo-wrapper">
        <div class="logo-flip">
          <img src="trust-logo.png" alt="Trust Logo" class="trust-logo" />
        </div>
      </div>
      <div class="loading-text">{{ message() }}</div>
    </div>
  </div>

  <style>
    .blur-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      animation: fadeInB 0.3s ease;
    }

    @keyframes fadeInB {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .loading-overlay {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .logo-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .logo-wrapper::before {
      content: '';
      position: absolute;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: white;
      border-bottom-color: white;
      opacity: 0.5;
      animation: rotate 0.4s linear infinite;
    }

    @keyframes rotate {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .logo-flip {
      width: 65px;
      height: 65px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    .trust-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
      filter: brightness(65%);
    }

    .loading-text {
      font-size: 1rem;
      font-weight: 600;
      color: white;
      letter-spacing: 1.5px;
    }
  </style>
</div>
