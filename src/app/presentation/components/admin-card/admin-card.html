<a class="card border-0 shadow-sm h-100 text-decoration-none admin-card-hover" role="button" (click)="onCardClick()">
    <div class="card-body d-flex align-items-center p-3">
        <div class="rounded-3 p-3 me-3 d-flex align-items-center justify-content-center"
            [style.background-color]="iconColor">
            <i class="bi text-white fs-4" [ngClass]="icon"></i>
        </div>
        <div class="flex-grow-1">
            <h6 class="fw-bold mb-1 text-dark">{{ title }}</h6>
            <p class="text-muted small mb-0">{{ description }}</p>
        </div>
        <div class="text-muted">
            <i class="bi bi-chevron-right"></i>
        </div>
    </div>
</a>
